# main 브랜치에 올리면 웹 버전을 GitHub Pages 에 자동 배포해요.
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔 주세요.
name: 웹 배포 (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/build-www.mjs
      - run: cp www/index.html www/404.html && touch www/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
